# dbox — dev container + Tailscale sidecar.
# The dev container shares the sidecar's network namespace, so its sshd is
# reachable on the tailnet (as ${DBOX_HOSTNAME}) without the dev container being privileged.

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${DBOX_HOSTNAME:-dbox}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${DBOX_HOSTNAME:-dbox}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ${DBOX_DATA:-./data}/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    # BREAK-GLASS for the very first LOCAL boot only (before Tailscale is up).
    # Loopback-bound so it is never exposed beyond this machine. Never use on a
    # public host. Because the dev container shares this netns, this maps to its
    # sshd. Uncomment, `docker compose up -d`, then `ssh -p 2222 dev@localhost`.
    # ports:
    #   - "127.0.0.1:2222:22"

  dev:
    build:
      context: .
    image: dbox:latest
    depends_on:
      - tailscale
    network_mode: service:tailscale
    environment:
      SSH_PUBKEY: ${SSH_PUBKEY}
    volumes:
      - ${DBOX_DATA:-./data}/workspace:/home/dev/workspace
      - ${DBOX_DATA:-./data}/claude:/home/dev/.claude
      - ${DBOX_DATA:-./data}/gh:/home/dev/.config/gh
      - ${DBOX_DATA:-./data}/fish:/home/dev/.local/share/fish
      - ${DBOX_DATA:-./data}/vscode-server:/home/dev/.vscode-server
      - ${DBOX_DATA:-./data}/sshkeys:/etc/ssh/keys
      # Control channel: `dbox-restart` drops a request here; the `restarter`
      # service below picks it up and rebuilds/recreates this dev container.
      - ${DBOX_DATA:-./data}/control:/home/dev/.dbox-control
    restart: unless-stopped

  # restarter — tiny sidecar that lets the box rebuild itself. It watches the
  # control dir for a request from `dbox-restart` and runs `docker compose up -d
  # --build dev` against the HOST daemon via the mounted socket. The socket
  # (= root-on-host) lives ONLY here, never in `dev` where Claude runs.
  restarter:
    image: docker:cli
    depends_on:
      - dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the compose clone at its OWN host path so `docker compose` resolves
      # bind-mount paths (./data, build context) the way the host daemon expects.
      - ${PWD}:${PWD}
      - ${DBOX_DATA:-./data}/control:/control
    working_dir: ${PWD}
    environment:
      PWD: ${PWD}                 # so the nested `docker compose` can re-resolve ${PWD}
      DBOX_CONTROL_DIR: /control
      # DBOX_RESTART_SCOPE: dev   # services to rebuild (default: just dev)
      # DBOX_WATCH_INTERVAL: 5    # poll seconds
    entrypoint: ["/bin/sh", "config/dbox-watch"]
    restart: unless-stopped
